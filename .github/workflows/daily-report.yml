name: Daily report

on:
  schedule:
    - cron: "10 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-report.yml"
      - "config/**"
      - "scripts/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "vendor/**"
      - "package*.json"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Target report date in YYYY-MM-DD. Defaults to today in Asia/Shanghai."
        required: false
        type: string
      force_regenerate:
        description: "Regenerate even if the target date already exists."
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required secrets
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          test -n "$ECS_HOST"
          test -n "$ECS_USER"
          test -n "$ECS_PORT"
          test -n "$ECS_SSH_KEY"

      - name: Generate report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORT_DATE: ${{ inputs.report_date }}
          FORCE_REPORT: ${{ inputs.force_regenerate || '0' }}
        run: node scripts/generate-report.mjs

      - name: Validate report
        run: node scripts/validate-report.mjs public/data/latest.json

      - name: Commit report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily report"
          file_pattern: "public/data/latest.json public/data/archive/*.json"

      - name: Prepare deploy directory
        run: |
          mkdir -p .deploy/public/data/archive .deploy/vendor
          cp index.html app.js styles.css .deploy/
          cp -R public/data .deploy/public/
          cp vendor/*.min.js .deploy/vendor/

      - name: Configure Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: "acs:ram::1585445614814217:role/daily-news-github-deployer"
          oidc-provider-arn: "acs:ram::1585445614814217:oidc-provider/github-actions-daily-news"
          role-session-name: "daily-news-${{ github.run_id }}"
          role-session-expiration: 1800
          audience: "github-actions"

      - name: Install ossutil
        run: |
          curl -fsSLo /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  /tmp/ossutil.zip" | sha256sum -c -
          unzip -q /tmp/ossutil.zip -d /tmp
          sudo install -m 0755 /tmp/ossutil-2.3.0-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version

      - name: Upload site to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          OSS_SESSION_TOKEN: ${{ env.ALIBABA_CLOUD_SECURITY_TOKEN }}
          OSS_REGION: cn-shanghai
          OSS_ENDPOINT: oss-cn-shanghai.aliyuncs.com
        run: ossutil sync .deploy/ oss://daily-news-2077-prod/ --force

      - name: Upload site to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          source: ".deploy/*"
          target: "/tmp/daily-news-release"
          overwrite: true
          strip_components: 1

      - name: Publish site on ECS
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_DIR: /var/www/daily-news
          RELEASE_DIR: /tmp/daily-news-release
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          envs: TARGET_DIR,RELEASE_DIR
          script: |
            set -eu
            mkdir -p "$TARGET_DIR"
            find "$TARGET_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -R "$RELEASE_DIR"/. "$TARGET_DIR"/
            chown -R nginx:nginx "$TARGET_DIR" || true
            nginx -t
            systemctl reload nginx

  notify:
    name: notify
    needs: generate
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout notification script
        uses: actions/checkout@v4

      - name: Notify daily-news WeChat test account
        continue-on-error: true
        env:
          WECHAT_DAILY_NEWS_APP_ID: ${{ secrets.WECHAT_DAILY_NEWS_APP_ID }}
          WECHAT_DAILY_NEWS_APP_SECRET: ${{ secrets.WECHAT_DAILY_NEWS_APP_SECRET }}
          WECHAT_DAILY_NEWS_OPEN_ID: ${{ secrets.WECHAT_DAILY_NEWS_OPEN_ID }}
          WECHAT_DAILY_NEWS_TEMPLATE_ID: ${{ secrets.WECHAT_DAILY_NEWS_TEMPLATE_ID }}
          REPORT_DATE: ${{ inputs.report_date }}
          RUN_RESULT: ${{ needs.generate.result }}
          DAILY_URL: https://daily.2077.fun
        run: |
          if [ -z "$WECHAT_DAILY_NEWS_APP_ID" ] || [ -z "$WECHAT_DAILY_NEWS_APP_SECRET" ] || [ -z "$WECHAT_DAILY_NEWS_OPEN_ID" ] || [ -z "$WECHAT_DAILY_NEWS_TEMPLATE_ID" ]; then
            echo "::warning::WeChat test-account secrets are not configured; skipping notification."
            exit 0
          fi
          node scripts/notify-wechat.mjs
